<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vrai Restant">
<meta name="theme-color" content="#EDF0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1411" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="sync.js"></script>
</head>
<body>
<title>Le Vrai Restant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one app column, a sticky segmented nav, summary-first cards; a receipt for the "bêtises". */
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --surface-2:#F5F7F3; --ink:#14201A; --muted:#5D6A62; --line:#D8DED6;
  --accent:#2448E8; --accent-soft:#E3E8FD; --pos:#14855A; --pos-soft:#DDF1E7; --neg:#D2433B; --neg-soft:#FBE3E1; --warn:#B87A06; --warn-soft:#FBEFD5;
  --paper:#FCFCF7; --paper-ink:#24221C; --paper-line:#CFCBBE;
  --e-courses:#24936F; --e-plaisir:#D9578F; --e-compl:#7656E8; --e-fable:#D98E1E; --e-vie:#3F78B5; --e-epargne:#0A9BA8; --e-fixe:#8A948D; --e-excep:#5B4636;
  --f-display:"Unbounded",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgba(20,32,26,.06),0 4px 16px rgba(20,32,26,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#171F1B; --surface-2:#1D2621; --ink:#E7EDE8; --muted:#95A39A; --line:#2A3530;
  --accent:#7B95FF; --accent-soft:#1E2747; --pos:#3DC48A; --pos-soft:#14301F; --neg:#FF6F66; --neg-soft:#3A1A18; --warn:#F0B53E; --warn-soft:#3A2D10;
  --paper:#E9E6DA; --paper-ink:#1F1D17; --paper-line:#B9B4A3;
  --e-courses:#3CC294; --e-plaisir:#F07BAE; --e-compl:#9C84FF; --e-fable:#F0AA3E; --e-vie:#6CA2DD; --e-epargne:#35C3CF; --e-fixe:#7D8981; --e-excep:#A88A72;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#171F1B; --surface-2:#1D2621; --ink:#E7EDE8; --muted:#95A39A; --line:#2A3530;
  --accent:#7B95FF; --accent-soft:#1E2747; --pos:#3DC48A; --pos-soft:#14301F; --neg:#FF6F66; --neg-soft:#3A1A18; --warn:#F0B53E; --warn-soft:#3A2D10;
  --paper:#E9E6DA; --paper-ink:#1F1D17; --paper-line:#B9B4A3;
  --e-courses:#3CC294; --e-plaisir:#F07BAE; --e-compl:#9C84FF; --e-fable:#F0AA3E; --e-vie:#6CA2DD; --e-epargne:#35C3CF; --e-fixe:#7D8981; --e-excep:#A88A72;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* mobile : pas de zoom automatique (iOS zoome sur tout champ < 16px) ni de zoom au double-tap */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
button,a,input,select,textarea,label{touch-action:manipulation}
@media (pointer:coarse),(max-width:820px){
  .catsel,.filters input,.filters select,.set-row input,.set-row select,.field input,.env .edit input,#recal,#imp{font-size:16px!important}
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:13px}
.balpill{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px}
.balpill .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.balpill .v{font-family:var(--f-mono);font-weight:700;font-size:16px}
.top{gap:10px 12px}
.hist{display:flex;gap:4px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.hbtn{border:0;background:transparent;color:var(--ink);width:36px;height:34px;border-radius:9px;display:grid;place-items:center}
.hbtn:hover:not(:disabled){background:var(--surface-2)}
.hbtn:disabled{opacity:.3;cursor:default}
.balwrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.balfut{font-size:12.5px;color:var(--muted);padding-right:10px}
.balfut b{font-family:var(--f-mono);color:var(--ink)}
.sync{font-size:11px;color:var(--muted);padding:3px 8px;border-radius:999px;background:var(--surface-2)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:14px -16px 18px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.seg button{flex:1;min-width:max-content;border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){.g2,.g3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.pos{background:var(--pos-soft);color:var(--pos)} .chip.neg{background:var(--neg-soft);color:var(--neg)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.pos-t{color:var(--pos)} .neg-t{color:var(--neg)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner b{color:var(--warn)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.today{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:460px){.today{grid-template-columns:1fr;justify-items:start}}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;line-height:1}
.today .big{font-size:clamp(34px,6vw,48px)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-weight:700;font-size:18px}
.calc .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.calc .row .num{font-weight:500}
.calc .row.total{border-bottom:0;padding-top:12px;align-items:baseline}
.calc .row.total .big{font-size:30px}
.alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin-top:10px;gap:2px}
.alloc span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* envelopes */
.envs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.envs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.envs{grid-template-columns:1fr}}
.env{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.env .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.env .nm{font-weight:700;display:flex;align-items:center;gap:8px}
.env .rem{font-family:var(--f-mono);font-weight:700;font-size:22px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:4px}
.env .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
.env input[type=range]{width:100%;accent-color:var(--ink)}
.env .edit{display:flex;align-items:center;gap:8px}
.env .edit input[type=number]{width:84px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);font-family:var(--f-mono);font-size:13px;text-align:right}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.li .a{font-family:var(--f-mono);font-weight:700;text-align:right}
.catsel{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:2px 6px;font-size:12px;max-width:190px}
.tbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.betbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:12px}
.betbtn[aria-pressed="true"]{background:var(--neg-soft);border-color:transparent;color:var(--neg)}
.betbtn .sw{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none}
.betbtn .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface)}
.betbtn[aria-pressed="true"] .sw{background:var(--neg)}
.betbtn[aria-pressed="true"] .sw::after{left:19px}
.betcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
@media (max-width:760px){.betcard{grid-template-columns:1fr}}
.betstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.betstats .kpi .v{font-size:20px}
.flag{border:1px solid var(--line);background:transparent;border-radius:7px;padding:2px 7px;font-size:12px;color:var(--muted)}
.flag[aria-pressed="true"]{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.dayhd{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 0 4px;border-bottom:1px solid var(--line)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:14px;min-width:0}
.filters input{flex:1 1 200px}

/* fixed */
.fx{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0}
.fx .n{font-weight:600;min-width:0}
.fx .n small{display:block;font-weight:400;color:var(--muted);font-size:12px}

/* bilans */
.months{display:flex;gap:6px;flex-wrap:wrap}
.months button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px}
.months button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpirow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:820px){.kpirow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpirow .kpi .v{font-size:20px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.donutwrap{display:grid;grid-template-columns:180px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:520px){.donutwrap{grid-template-columns:1fr;justify-items:center}}
.catlist{width:100%;font-size:13px}
.catlist .r{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.catlist .r:last-child{border-bottom:0}
.catlist .pct{color:var(--muted);font-family:var(--f-mono);font-size:12px;width:40px;text-align:right}
.insight{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.insight:last-child{border-bottom:0}
.insight .ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-family:var(--f-mono);font-size:13px}

/* receipt */
.receipt{background:var(--paper);color:var(--paper-ink);font-family:var(--f-mono);font-size:13px;padding:22px 20px 26px;position:relative;
  --z:8px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/calc(2*var(--z)) 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/calc(2*var(--z)) 51% repeat-x;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/calc(2*var(--z)) 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/calc(2*var(--z)) 51% repeat-x;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.08))}
.receipt .ttl{text-align:center;font-weight:700;letter-spacing:.2em;font-size:14px}
.receipt .ctr{text-align:center;font-size:11px;opacity:.7;margin-top:2px}
.receipt hr{border:0;border-top:1px dashed var(--paper-line);margin:12px 0}
.receipt .ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:3px 0}
.receipt .ln .q{opacity:.65;font-size:11.5px}
.receipt .tot{display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.receipt .note{font-size:11.5px;opacity:.8;margin-top:8px;line-height:1.5}
.receipt .bc{height:34px;margin-top:14px;background:repeating-linear-gradient(90deg,var(--paper-ink) 0 2px,transparent 2px 4px,var(--paper-ink) 4px 5px,transparent 5px 8px,var(--paper-ink) 8px 11px,transparent 11px 12px);opacity:.85}

/* settings */
.set-row{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.set-row.inc4{grid-template-columns:minmax(0,1fr) 100px 58px auto}
.set-row.fx4{grid-template-columns:auto minmax(0,1fr) 100px 64px auto}
.set-row input[type=text],.set-row input[type=number],.set-row select{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 9px;font-size:14px}
.set-row input[type=number]{font-family:var(--f-mono);text-align:right}
@media (max-width:520px){.set-row.fx4{grid-template-columns:auto minmax(0,1fr) 90px auto}.set-row.fx4 .day{display:none}}
.toggle{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.toggle input{margin-top:3px;accent-color:var(--accent)}

/* fab + sheet */
.fabs{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:10px}
.fab.gain{background:var(--pos);box-shadow:0 8px 24px color-mix(in srgb,var(--pos) 35%,transparent)}
.fab{border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:14px 20px;box-shadow:0 8px 24px rgba(36,72,232,.35);display:flex;gap:8px;align-items:center}
.fab b{font-size:20px;line-height:1}
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h3{font-family:var(--f-display);font-size:18px;margin-bottom:12px}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--ink);padding:4px 0;margin:6px 0 14px}
.amt input{border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:40px;width:100%;min-width:0;outline:none}
.amt span{font-family:var(--f-display);font-size:28px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 10px;font-size:15px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cats .grp{width:100%;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:6px}
.typeseg{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:6px}
.typeseg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px;font-weight:600;color:var(--muted)}

function allOps(){

      const bm=bMonth(v);
      if(real.some(o=>o.a>0 && bMonth(o)===bm && incMatches(o,t))) continue;

  }
  return real.concat(virt).map(o=>({...o,f:o.d>TODAY?1:0})).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(b.m-a.m)||(a.id<b.id?1:-1));

function incMatches(o,t){
  if(o.tid) return o.tid===t.id;
  if(o.v) return false;
  if(o.c!==t.c) return false;
  if(t.c==="salaire"||t.c==="caf") return true;
  return Math.abs(o.a-t.a)<=0.2*t.a || o.l.toLowerCase().includes(String(t.n).toLowerCase());
}
function upcoming(ops,M){

}
function bMonth(o){

}
function isBetise(o){
  if(o.a>=0) return null;

function balanceNow(ops){return OPENING+ops.filter(o=>!o.f).reduce((s,o)=>s+o.a,0)}

function compute(M, ops){
  ops = ops||allOps();
  const start=M+"-01";

  const incIn = ops.filter(o=>o.a>0 && bMonth(o)===M && (!o.f || S.opt.expect));
  const shiftedIn = incIn.filter(o=>o.d.slice(0,7)!==M).reduce((s,o)=>s+o.a,0);
  const nextShift = ops.filter(o=>o.a>0 && o.d.slice(0,7)===M && bMonth(o)!==M && (!o.f||S.opt.expect)).reduce((s,o)=>s+o.a,0);
  const R = balStart - shiftedIn;
  const incRecv = incIn.reduce((s,o)=>s+o.a,0);
  const incT = S.inc.map(t=>{const got=ops.filter(o=>o.a>0&&bMonth(o)===M&&(o.tid===t.id||incMatches(o,t)));const fut=got.filter(o=>o.f);const done=got.filter(o=>!o.f);return {...t,recv:done.reduce((s,o)=>s+o.a,0),exp:fut.reduce((s,o)=>s+o.a,0),got:done.length,auto:done.some(o=>o.v),fut}});
  const expected = incIn.filter(o=>o.f).reduce((s,o)=>s+o.a,0);
  const I = incRecv;
  const exps = ops.filter(o=>o.a<0 && o.d.slice(0,7)===M);
  const used = new Set();
  const fixed = S.fixed.filter(f=>f.on).map(f=>{
    const re=safeRe(f.re||f.n);
    const mt=exps.filter(o=>!used.has(o.id) && re.test(o.l));
    mt.forEach(o=>used.add(o.id));
    const actual=-mt.reduce((s,o)=>s+o.a,0);
    return {...f,paid:mt.length>0,actual,amt:mt.length?actual:f.a,ops:mt};
  });
  const otherFixed = exps.filter(o=>!used.has(o.id) && (CATS[o.c]||CATS.acat).env==="fixe");
  otherFixed.forEach(o=>used.add(o.id));
  const F = fixed.reduce((s,f)=>s+f.amt,0) - otherFixed.reduce((s,o)=>s+o.a,0);
  const unpaid = fixed.filter(f=>!f.paid).reduce((s,f)=>s+f.a,0);
  let E=0; const excepOps=[];
  const spent={courses:0,plaisir:0,vie:0,compl:0,fable:0,epargne:0};
  const flexByDay={};
  for(const o of exps){
    if(used.has(o.id)) continue;
    const cat=CATS[o.c]||CATS.acat;
    if(cat.env==="excep"){E+=-o.a;excepOps.push(o);continue}
    let env=cat.env; if(env==="rev"||!spent.hasOwnProperty(env)) env="vie";

  }
  const VR = R + I - F - E;
  const eps = Math.max(0,VR)*S.env.epct/100;
  const budget={courses:+S.env.courses||0,plaisir:+S.env.plaisir||0,vie:+S.env.vie||0,compl:+S.env.compl||0,fable:+S.env.fable||0,epargne:eps};
  const allocated=Object.values(budget).reduce((a,b)=>a+b,0);
  const marge = VR - allocated;
  const rem={}; for(const k in budget) rem[k]=budget[k]-spent[k];
  const D=dim(M); const cur=(M===CM); const past=M<CM;
  const dayN = cur? +TODAY.slice(8) : (past? D : 1);
  const daysLeft = cur? D-dayN+1 : (past?0:D);
  const flexRem = rem.courses+rem.plaisir+rem.vie;
  const spentToday = cur? (flexByDay[TODAY]||0) : 0;
  const pool = flexRem + Math.max(0,VR - Object.values(budget).reduce((x,y)=>x+y,0)) + spentToday;
  const daily = daysLeft>0? pool/daysLeft : 0;
  const todayLeft = daily - spentToday;

  const weekDays = cur? Math.min(daysLeft,7-wd) : 0;
  const weekLeft = daily*weekDays - spentToday;

  const balNow = balanceNow(ops);
  const futureSum = upcoming(ops,M).reduce((s,o)=>s+o.a,0);
  const proj = balNow + futureSum - nextShift - unpaid - Object.keys(rem).reduce((s,k)=>s+Math.max(0,rem[k]),0);
  const toCat = exps.filter(o=>o.c==="acat" && !used.has(o.id));
  return {M,R,I,incRecv,incT,expected,F,fixed,unpaid,E,excepOps,VR,budget,spent,rem,marge,allocated,daysLeft,dayN,D,daily,todayLeft,weekLeft,weekDays,weekSpent,spentToday,flexRem,otherFixed,balNow,proj,futureSum,nextShift,nextShiftFut:ops.filter(o=>o.f&&o.a>0&&o.d.slice(0,7)===M&&bMonth(o)!==M&&S.opt.expect).reduce((s,o)=>s+o.a,0),toCat,cur,perDay:k=>daysLeft>0?rem[k]/daysLeft:0};
}

function monthsList(ops){
  const s=new Set(ops.filter(o=>!o.f).map(o=>o.d.slice(0,7))); s.add(CM);

function bilan(M, ops){
  ops = ops.filter(o=>!o.f);
  const inOps = ops.filter(o=>o.a>0 && (S.opt.shift?bMonth(o):o.d.slice(0,7))===M);
  const outOps = ops.filter(o=>o.a<0 && o.d.slice(0,7)===M);

  for(const o of outOps){

    const mk=o.l.replace(/ \(.*\)$/,"");
    byMer[mk]=byMer[mk]||{n:mk,s:0,c:0}; byMer[mk].s-=o.a; byMer[mk].c++;

  }

function balanceSeries(ops){

async function initDb(){
  try{

    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;

    const snap=await dbRef.get();
    if(snap.exists && snap.data() && snap.data().state){merge(snap.data().state);if(migrate()) save(true);syncSnap();try{localStorage.setItem("vrai-restant",JSON.stringify(S))}catch(e){};render()}
    else{await dbRef.set({state:S,at:new Date().toISOString()})}
    setSync("synchronisé");
    dbRef.onSnapshot(sn=>{
      if(!sn.exists || (sn.metadata&&sn.metadata.hasPendingWrites)) return;
      const st=sn.data()&&sn.data().state; if(!st) return;
      if(JSON.stringify(st)===JSON.stringify(S)) return;

function niceStep(max){const raw=max/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function lineChart(series,hlMonth){
  const W=640,H=220,pl=48,pr=12,pt=14,pb=28;
  const vals=series.map(p=>p.b); let mn=Math.min(0,...vals), mx=Math.max(...vals);
  const step=niceStep(mx-mn); mn=Math.floor(mn/step)*step; mx=Math.ceil(mx/step)*step;
  const x=i=>pl+(W-pl-pr)*i/(series.length-1), y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let g="";
  for(let v=mn;v<=mx+0.01;v+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${Math.abs(v)<0.01?'stroke-dasharray="0"':'stroke-dasharray="2 4"'}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}
  // month bands + labels
  let lastM="";
  series.forEach((p,i)=>{const m=p.d.slice(0,7); if(m!==lastM){lastM=m; if(m===hlMonth){let j=i;while(j<series.length&&series[j].d.slice(0,7)===m)j++; g+=`<rect x="${x(i)}" y="${pt}" width="${x(j-1)-x(i)}" height="${H-pt-pb}" fill="var(--accent-soft)" opacity=".6"/>`} g+=`<line x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)"/><text x="${x(i)+4}" y="${H-10}">${mLabel(m,true)}</text>`}});
  const pts=series.map((p,i)=>`${x(i).toFixed(1)},${y(p.b).toFixed(1)}`);
  const area=`M${x(0)},${y(0)} L${pts.join(" L")} L${x(series.length-1)},${y(0)} Z`;
  g+=`<defs><clipPath id="cpPos"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath><clipPath id="cpNeg"><rect x="0" y="${y(0)}" width="${W}" height="${H}"/></clipPath></defs>`;
  g+=`<path d="${area}" fill="var(--accent)" opacity=".12" clip-path="url(#cpPos)"/><path d="${area}" fill="var(--neg)" opacity=".35" clip-path="url(#cpNeg)"/>`;
  g+=`<polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--neg)" stroke-width="1"/>`;
  let mi=0; series.forEach((p,i)=>{if(p.b<series[mi].b)mi=i});
  const last=series.length-1;
  g+=`<circle cx="${x(mi)}" cy="${y(series[mi].b)}" r="4" fill="var(--neg)"/><text x="${Math.min(x(mi)+6,W-120)}" y="${y(series[mi].b)+16}" style="fill:var(--neg)">${eur(series[mi].b)} · ${+series[mi].d.slice(8)} ${MS[+series[mi].d.slice(5,7)-1]}</text>`;
  g+=`<circle cx="${x(last)}" cy="${y(series[last].b)}" r="4.5" fill="var(--accent)"/><text x="${x(last)-6}" y="${y(series[last].b)-9}" text-anchor="end" style="fill:var(--ink);font-weight:700">${eur(series[last].b)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du solde">${g}</svg>`;
}

function betiseCard(ops){

  const prevSame=-real.filter(o=>o.d.slice(0,7)===P && +o.d.slice(8)<=day && isBetise(o)).reduce((s,o)=>s+o.a,0);
  const prevAll=-real.filter(o=>o.d.slice(0,7)===P && isBetise(o)).reduce((s,o)=>s+o.a,0);
  const last=real.filter(o=>isBetise(o)).map(o=>o.d).sort().pop();

    <div class="note">Soit ${B.tout?Math.round(betT/B.tout*100):0} % de tes sorties du mois.<br>À ce rythme sur 12 mois : <b>${eur0(betT/Math.max(1,daysM)*365)}</b>${betT>0?`<br>≈ ${Math.floor(betT/(+S.env.compl||60))} mois de compléments, ou ${Math.floor(betT/(+S.env.fable||30))} mois de crédits Fable.`:""}</div>
    <div class="note">Clique « bêtise ? » sur n'importe quelle opération pour l'ajouter ou la retirer du ticket.</div><div class="bc" aria-hidden="true"></div></div>

   <div class="card"><h2>Où tu dépenses le plus</h2>${mers.map((x,i)=>`<div class="li"><div class="t">${esc(x.n)}</div><div class="a">${eur(x.s)}</div><div class="s">${x.c} opération${x.c>1?"s":""} · ${eur(x.s/x.c)} en moyenne</div></div>`).join("")}</div></div>`;

function insights(B,P,redDays,minM,bet,daysM){
  const out=[]; const R=(i,t,tone)=>out.push({i,t,bg:tone==="neg"?"var(--neg-soft)":tone==="pos"?"var(--pos-soft)":"var(--accent-soft)",c:tone==="neg"?"var(--neg)":tone==="pos"?"var(--pos)":"var(--accent)"});
  if(redDays) R("!",`<b>${redDays} jour${redDays>1?"s":""} à découvert</b> ce mois-ci, jusqu'à ${eur(minM)}. C'est la semaine avant la paie qui coince.`, "neg");
  else R("✓",`Aucun jour à découvert ce mois-ci. Le point le plus bas : ${eur(minM)}.`,"pos");
  if(P){const d=B.tout-P.tout; const pc=P.tout?Math.round(d/P.tout*100):0; R(d>0?"↑":"↓",`Sorties ${d>0?"en hausse":"en baisse"} de <b>${eur(Math.abs(d))}</b> (${pc>0?"+":""}${pc} %) par rapport à ${mLabel(P.M)}.`, d>0?"neg":"pos")}
  if(bet[0]) R("1",`Plus grosse fuite : <b>${esc(bet[0].n)}</b>, ${bet[0].c} ${bet[0].unit||"fois"} pour ${eur(bet[0].s)}.`,"neg");
  const dist=bet.find(x=>/Distrib/.test(x.n)); if(dist) R("☕",`Le distributeur : ${dist.c} passages × ~0,40 €. Ça paraît rien, mais ça fait ${eur0(dist.s/Math.max(1,daysM)*365)} par an.`,"acc");
  const esp=B.byCat.especes; if(esp) R("€",`${eur(esp)} retirés en espèces : impossible de savoir où ils sont partis. Note-les ici quand tu les dépenses.`,"acc");
  const sav=B.tin? (B.net/B.tin*100):0; if(B.tin>300) R("%",`Taux d'épargne du mois : <b>${Math.round(sav)} %</b> de tes entrées${sav<10?" — sous ton objectif de 10 %":""}.`, sav>=10?"pos":"neg");
  return out;
}

    const nb=document.getElementById("nb-"+k); if(nb && document.activeElement!==nb) nb.value=C.budget[k];
  }
  const l=document.getElementById("epct-l"); if(l) l.textContent=S.env.epct+" %";
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(el.tagName==="SELECT"||el.tagName==="INPUT") return;
  if(a==="goto"){UI.tab=el.dataset.tab;render();window.scrollTo(0,0)}
  else if(a==="gotoacat"){UI.tab="ops";UI.fc="acat";UI.fm=CM;render();window.scrollTo(0,0)}
  else if(a==="editop"){openEdit(id)}
  else if(a==="export"){const txt=JSON.stringify(S);const ta=document.getElementById("imp");const fb=()=>{if(ta){ta.value=txt;ta.focus();ta.select()}toast("Sélectionne le texte et copie-le")};try{navigator.clipboard.writeText(txt).then(()=>toast("Données copiées : colle-les dans l'autre version"),fb)}catch(_){fb()}}
  else if(a==="import"){const ta=document.getElementById("imp");let x;try{x=JSON.parse(ta.value.trim())}catch(_){toast("Ce texte n'est pas reconnu : recopie-le en entier");return}if(!x||typeof x!=="object"||!x.env){toast("Ce texte ne contient pas de données de l'outil");return}lbl("import de données");merge(x);migrate();save();render();toast("Données importées")}
  else if(a==="essave"){safe(submitEdit)()}
  else if(a==="shsave"){safe(submitSheet)()}
  else if(a==="escat"){UI.esheet.c=el.dataset.c;renderEdit()}
  else if(a==="esbet"){UI.esheet.b=!UI.esheet.b;renderEdit()}
  else if(a==="esfixe"){const s=UI.esheet;S.fixed.push({id:"f"+Date.now(),n:s.l.trim()||"Abonnement",a:+(-s.a).toFixed(2),day:+s.d.slice(8),re:(s.l.trim()||"Abonnement").replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),on:true});submitEdit();toast("Ajoutée aux charges fixes")}
  else if(a==="editcat"){UI.edit=id;render();const s=document.getElementById("cs-"+id);if(s){s.focus();try{s.showPicker&&s.showPicker()}catch(_){}}}
  else if(a==="month"){UI.month=el.dataset.m;render()}
  else if(a==="flag"){lbl("bêtise marquée/retirée");const o=findOp(id); const cur=isBetise(o); setOver(id,"b",cur?0:1); }
  else if(a==="del"){UI.confirm=id;render()}
  else if(a==="delno"){UI.confirm=null;render()}
  else if(a==="delok"){lbl("suppression d'une opération");S.manual=S.manual.filter(o=>o.id!==id);UI.confirm=null;save();render();toast("Opération supprimée")}
  else if(a==="fxdel"){lbl("suppression d'une charge fixe");S.fixed=S.fixed.filter(f=>f.id!==id);save();render();toast("Charge supprimée")}
  else if(a==="fxadd"){S.fixed.push({id:"f"+Date.now(),n:"Nouvelle charge",a:10,day:1,re:"",on:true});save();render()}
  else if(a==="incdel"){lbl("suppression d'un revenu");S.inc=S.inc.filter(t=>t.id!==id);save();render()}
  else if(a==="incadd"){S.inc.push({id:"i"+Date.now(),n:"Autre revenu",a:0,c:"autre_rev",day:null,since:CM});save();render()}
  else if(a==="recv"){const o=findOp(id); if(!o) return; lbl(o.l+" marqué reçu"); if(o.v){S.manual.push({id:"m"+Date.now(),d:TODAY,l:o.l,a:o.a,c:o.c,tid:o.tid})} else {const m=S.manual.find(x=>x.id===id); if(m) m.d=TODAY} save();render();toast(`${o.l} reçu · solde ${eur(balanceNow(allOps()))}`)}
  else if(a==="reset"){UI.confirm="reset";render()}
  else if(a==="resetok"){S=clone(DEFAULT);migrate();UI.confirm=null;save();render();toast("Réglages remis à zéro")}
  else if(a==="recal"){const v=parseFloat(String(document.getElementById("recal").value).replace(",","."));if(isNaN(v)){toast("Entre ton solde actuel");return}const d=+(v-balanceNow(allOps())).toFixed(2);if(Math.abs(d)<0.01){toast("Ton solde est déjà juste");return}S.manual.push({id:"m"+Date.now(),d:TODAY,l:d<0?"Écart de solde (dépenses non notées)":"Écart de solde",a:d,c:d<0?"acat":"autre_rev"});save();render();toast("Solde recalé")}
  else if(a==="close"){if(e.target===el||el.tagName==="BUTTON"){UI.sheet=null;UI.esheet=null;renderSheet()}}
  else if(a==="shtype"){UI.sheet.type=el.dataset.t;UI.sheet.c=el.dataset.t==="rev"?"famille":"courses";renderSheet()}
  else if(a==="shcat"){UI.sheet.c=el.dataset.c;renderSheet()}
});
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;UI.tab=b.dataset.tab;UI.confirm=null;render();window.scrollTo(0,0)});
document.getElementById("fab").addEventListener("click",()=>openSheet("dep"));
document.getElementById("undo").addEventListener("click",undo);
document.getElementById("redo").addEventListener("click",redo);
document.addEventListener("keydown",e=>{
  if(!(e.metaKey||e.ctrlKey)) return; const k=e.key.toLowerCase();
  if(e.target.tagName==="INPUT"&&e.target.type!=="range"&&e.target.type!=="checkbox") return; // laisse Cmd+Z natif dans les champs
  if(k==="z"&&!e.shiftKey){e.preventDefault();undo()} else if((k==="z"&&e.shiftKey)||k==="y"){e.preventDefault();redo()}
});
document.getElementById("fab-gain").addEventListener("click",()=>openSheet("rev"));
document.addEventListener("submit",e=>{if(e.target.id==="shform"){e.preventDefault();submitSheet()} if(e.target.id==="esform"){e.preventDefault();submitEdit()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.tagName==="INPUT" && e.target.type!=="checkbox"){ if(UI.esheet){e.preventDefault();submitEdit();return} if(UI.sheet){e.preventDefault();submitSheet();return} }
  if(e.key==="Escape"&&(UI.sheet||UI.esheet)){UI.sheet=null;UI.esheet=null;renderSheet()}});
document.addEventListener("input",e=>{
  const el=e.target, a=el.dataset.act; if(!a) return;
  if(a==="env"){S.env[el.dataset.k]=+el.value; const nb=document.getElementById("nb-"+el.dataset.k); if(nb) nb.value=el.value; save(); render({keepEnv:true})}
  else if(a==="epct"){S.env.epct=+el.value; save(); render({keepEnv:true})}
  else if(a==="q"){UI.q=el.value;render()}
  else if(a==="es"){UI.esheet[el.dataset.f]=el.value}
  else if(a==="sh"){const f=el.dataset.f; UI.sheet[f]=el.type==="checkbox"?el.checked:el.value; if(f==="amt"||f==="d"){const p=document.getElementById("sh-impact"); const keep=el.id; sheetImpactOnly()}}
});
document.addEventListener("change",e=>{
  const el=e.target, a=el.dataset.act; if(!a) return;
  if(a==="cat"){UI.edit=null;setOver(el.dataset.id,"c",el.value)}
  else if(a==="envn"){S.env[el.dataset.k]=Math.max(0,+el.value||0);save();render()}
  else if(a==="env"||a==="epct"){render()}
  else if(a==="fm"){UI.fm=el.value;render()}
  else if(a==="fc"){UI.fc=el.value;render()}
  else if(a==="fx"){const f=S.fixed.find(x=>x.id===el.dataset.id); if(!f) return; const k=el.dataset.f; if(k==="on") f.on=el.checked; else if(k==="n"){f.n=el.value; if(!f.re||f.reAuto){f.re=el.value.split(/[\s(]/)[0];f.reAuto=true}} else f[k]=+el.value; save(); render()}
  else if(a==="inc"){const t=S.inc.find(x=>x.id===el.dataset.id); if(!t) return; const k=el.dataset.f; t[k]=k==="a"?+el.value:k==="day"?(el.value?Math.max(1,Math.min(31,+el.value)):null):el.value; save(); render()}
  else if(a==="opt"){S.opt[el.dataset.f]=el.checked; save(); render()}
});
function findOp(id){return allOps().find(o=>o.id===id)}
function setOver(id,k,v){
  if(id.startsWith("m")){const o=S.manual.find(x=>x.id===id); if(o){o[k]=v}}
  else{S.over[id]=S.over[id]||{}; S.over[id][k]=v}
  save(); render();
}

syncSnap(); updHist();
render();
initDb();
</script>

</body>
</html>
